<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1a103c" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Orbs Gradient -->
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Data Stream Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .bg-grid {
        stroke: #334155;
        stroke-opacity: 0.18;
        stroke-width: 1;
      }
      .stream-path {
        stroke: url(#lineGrad);
        stroke-width: 2.5;
        fill: none;
        stroke-dasharray: 8 12;
        animation: dash 15s linear infinite;
      }
      .node-pulse {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .float-orb {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -200;
        }
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes floatOrb {
        0% { transform: translate(0, 0); }
        100% { transform: translate(25px, -15px); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
        fill: #f8fafc;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 18px;
        letter-spacing: 0.2px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Orbs (Behind everything) -->
  <g class="float-orb">
    <circle cx="220" cy="90" r="140" fill="url(#orbCyan)" filter="url(#glow)" />
    <circle cx="980" cy="320" r="160" fill="url(#orbPurple)" filter="url(#glow)" />
  </g>

  <!-- Technical Grid Background Pattern -->
  <g class="bg-grid">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Data Pipeline Connecting Stream (Behind foreground text) -->
  <g>
    <path class="stream-path" d="M 80,360 C 260,330 400,380 600,350 S 920,380 1120,340" />
    <path class="stream-path" d="M 80,60 C 280,100 480,40 680,70 S 980,50 1120,80" />

    <!-- Animated Data Flow Particles -->
    <circle r="4" fill="#38bdf8" filter="url(#glow)">
      <animateMotion path="M 80,360 C 260,330 400,380 600,350 S 920,380 1120,340" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle r="4.5" fill="#c084fc" filter="url(#glow)">
      <animateMotion path="M 80,60 C 280,100 480,40 680,70 S 980,50 1120,80" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Interactive/Dynamic Architecture Cards (Bottom decorative row) -->
  <g transform="translate(100, 310)">
    <!-- Storefronts Pill -->
    <g transform="translate(0, 0)">
      <rect width="180" height="46" rx="23" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="24" cy="23" r="7" fill="#38bdf8" />
      <text x="42" y="28" class="tag-text">🛍️ Storefronts &amp; POS</text>
    </g>

    <!-- Arrow -->
    <path d="M 190,23 L 225,23" stroke="#64748b" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Middleware Engine Pill -->
    <g transform="translate(235, 0)">
      <rect width="220" height="46" rx="23" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.9" />
      <circle cx="24" cy="23" r="7" fill="#818cf8" class="node-pulse" />
      <text x="42" y="28" class="tag-text">⚡ Integration Middleware</text>
    </g>

    <!-- Arrow -->
    <path d="M 465,23 L 500,23" stroke="#64748b" stroke-width="2" stroke-dasharray="3 3" />

    <!-- ERP & Finance Pill -->
    <g transform="translate(510, 0)">
      <rect width="210" height="46" rx="23" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="24" cy="23" r="7" fill="#c084fc" />
      <text x="42" y="28" class="tag-text">🏢 ERP, NetSuite &amp; WMS</text>
    </g>

    <!-- Arrow -->
    <path d="M 730,23 L 765,23" stroke="#64748b" stroke-width="2" stroke-dasharray="3 3" />

    <!-- 3PL & Fulfillment Pill -->
    <g transform="translate(775, 0)">
      <rect width="215" height="46" rx="23" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="24" cy="23" r="7" fill="#34d399" />
      <text x="42" y="28" class="tag-text">📦 3PL &amp; Carrier Sync</text>
    </g>
  </g>

  <!-- Foreground Main Headers & Content (Stands prominently in foreground) -->
  <g transform="translate(0, 0)">
    <!-- Badge Indicator -->
    <g transform="translate(435, 65)">
      <rect width="330" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="15" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED AWESOME ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="150" text-anchor="middle" class="title-text">
      Awesome E-Commerce Integration Middleware
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="600" y="195" text-anchor="middle" class="subtitle-text">
      The definitive curated guide to iPaaS, Order Routing, Inventory Sync &amp; Open-Source Commerce Bridges
    </text>

    <!-- Dynamic Metric Pills in Center Foreground -->
    <g transform="translate(320, 230)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="82" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🛒 Order &amp; Cart Sync</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="90" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">📊 Real-time Inventory</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(375, 0)">
        <rect width="185" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="92" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🔓 Open Source &amp; iPaaS</text>
      </g>
    </g>
  </g>
</svg>
